<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kqOrange" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="kqBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="kqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Orange Kinetic Loop -->
  <path d="M 47 47 L 34 32 C 28 25 18 31 16 40 C 13 54 23 70 36 67 C 45 64 47 52 47 47" 
        stroke="url(#kqOrange)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28 29 C 24 35 18 48 23 58" 
        stroke="url(#kqOrange)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Right Blue Lower Precision Loop -->
  <path d="M 53 53 L 68 68 C 76 76 86 68 83 58 C 80 49 68 47 53 47" 
        stroke="url(#kqBlue)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Blue Upper Velocity Arrow -->
  <path d="M 52 47 L 76 23" 
        stroke="url(#kqBlue)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M 57 21 L 81 19 L 79 43 Z" 
        fill="url(#kqBlue)" stroke="url(#kqBlue)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Center Precision Junction Node -->
  <circle cx="49" cy="48" r="6.5" fill="#FF7A18"/>
  <circle cx="49" cy="48" r="3.2" fill="#070B12"/>
</svg>
